        </div>
        <script>
            const BACKGROUNDS_URL =
                "https://raw.githubusercontent.com/NavalHistorianAtLarge/AzurLaneData/main/backgrounds.json";

            let backgroundsCache = null;

            // Returns the image URL for a background id (the "class" field), or null if not found.
            async function getBackground(id) {
                try {
                    if (!backgroundsCache) {
                        const response = await fetch(BACKGROUNDS_URL);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        backgroundsCache = await response.json();
                    }
                    const match = backgroundsCache.find(entry => entry.class === id);
                    return match ? match.link : null;
                } catch (err) {
                    console.error("Error loading backgrounds:", err);
                    return null;
                }
            }

            // Use the <body>'s id (or its class, if it has no id) to pick the background.
            (async () => {
                const body = document.body;
                const id = body.id || body.classList[0];
                if (!id) return;
                const url = await getBackground(id);
                if (!url) {
                    console.warn("No background found for:", id);
                    return;
                }
                body.style.backgroundImage = `url(${url})`;
                body.style.backgroundSize = "cover";
                body.style.backgroundAttachment = "fixed";
            })();

            // Each .item div with an id gets its <img> filled from the background with that id.
            document.querySelectorAll(".item[id]").forEach(async item => {
                const url = await getBackground(item.id);
                if (!url) {
                    console.warn("No background found for:", item.id);
                    return;
                }
                item.querySelector("img").src = url;
            });
        </script>
    </body>
