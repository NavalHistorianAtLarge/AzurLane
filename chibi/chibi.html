<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="chibi.css">
    
    </head>
    <body>
          <div id="controls">
            <input list="chibiList" id="chibiSelectorInput" placeholder="Type or select a chibi..." />
            <datalist id="chibiList">
                    <option value="zuikaku">
                    <option value="akagi">
                    <option value="kaga">
                    <option value="shoukaku">
                    <option value="taihou">
            </datalist>

            <label for="skinSelector">Choose Skin:</label>
            <select id="skinSelector"></select>

            <label for="animationSelector">Choose Animation:</label>
            <select id="animationSelector"></select>

           <button>▶️ Play</button>
          </div>

          <div id="chibiCanvas"></div>

        <script type="application/json" id="chibiData">
                    {
                    "zuikaku": ["zuikaku", "zuikaku1", "zuikaku2"],
                    "akagi": ["default", "dark_fox"],
                    "kaga": ["default", "white_wolf"],
                      "shoukaku": ["default", "phoenix_feathers"],
                    "taihou": ["default", "midnight_empress"]
                    }
            </script>
        <script src="libs/pixi.min.js"></script> <!-- ✅ PixiJS v5 -->
        <script src="libs/pixi-spine.min.js"></script>
        <script type="module" src="chibi.js"></script>
    </body>

</html>
